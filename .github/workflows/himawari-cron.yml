name: Himawari cron

on:
  schedule:
    # GitHub dùng giờ UTC và có thể chạy trễ vài phút khi máy chủ bận.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: himawari-cron
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cron

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài Puppeteer
        working-directory: himawari/cron
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund puppeteer@24
          npx puppeteer browsers install chrome

      - name: Chụp và tải ảnh
        working-directory: cron
        env:
          HIMAWARI_CRON_URL: ${{ secrets.HIMAWARI_CRON_URL }}
        run: node himawari-cron.mjs
